name: School ERP CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --filter @school-erp/web exec vitest run

      - name: Build frontend
        run: pnpm --filter @school-erp/web build

  backend-tests:
    name: Backend Tests and MongoDB Integration
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/school-erp-test?replicaSet=rs0
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/school-erp-test?replicaSet=rs0
      JWT_ACCESS_SECRET: ci-test-access-secret-0123456789-abcdef
      JWT_REFRESH_SECRET: ci-test-refresh-secret-9876543210-fedcba
      WEB_URL: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start MongoDB replica set
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: 7.0
          mongodb-replica-set: rs0
          mongodb-port: 27017

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify MongoDB test configuration
        run: |
          node --input-type=module -e "const uri = process.env.MONGO_TEST_URI; if (!uri || !uri.includes('/school-erp-test?') || !uri.includes('replicaSet=rs0')) process.exit(1); console.log('MongoDB integration-test URI configured for school-erp-test replica set.')"

      - name: Run backend tests
        run: pnpm --filter @school-erp/api test
